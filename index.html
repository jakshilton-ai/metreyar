<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متره‌یار</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mut:#5b6777;--pri:#1565c0;--prc:#fff;--res:#e3f0ff;--bd:#d5dce6;--bg2:#cfe2f7;--gl:rgba(21,101,192,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1c222b;--tx:#eaeef3;--mut:#9aa6b5;--pri:#64a8ff;--prc:#0b1220;--res:#1d2f47;--bd:#2f3a48;--bg2:#070a0e;--gl:rgba(100,168,255,.08)}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1c222b;--tx:#eaeef3;--mut:#9aa6b5;--pri:#64a8ff;--prc:#0b1220;--res:#1d2f47;--bd:#2f3a48;--bg2:#070a0e;--gl:rgba(100,168,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;min-height:100vh;color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
header{padding:18px 16px 6px;text-align:center}
h1{margin:0;font-size:24px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
main{max-width:560px;margin:0 auto;padding:12px 16px 32px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--prc);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:10px}
label{display:block;font-size:14px;margin:10px 0 4px}
.row{display:flex;align-items:center;gap:8px}
input{flex:1;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;direction:ltr;text-align:right}
.u{font-size:13px;color:var(--mut);min-width:64px}
.go{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:var(--pri);color:var(--prc);font:inherit;font-size:16px;font-weight:bold;cursor:pointer}
.res{background:var(--res);border-radius:14px;padding:14px 16px;margin-top:14px}
.res div{padding:3px 0}
.tot{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);font-weight:bold}
.pr{background:transparent;border:1px solid var(--pri);color:var(--pri);margin-top:10px}
.note{font-size:12px;color:var(--mut);margin-top:16px;text-align:center}
@media print{header p,.tabs,#form,.go,.pr,.note{display:none}body{background:#fff;color:#000}.res{background:#fff;border:1px solid #999}}
.wrap{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px;text-align:center;margin-top:6px}
.tb th,.tb td{border:1px solid var(--bd);padding:5px 4px}
.tb th{background:var(--res)}
details{border-top:1px solid var(--bd);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:bold;padding:4px 0}
.n{font-size:12px;color:var(--mut);margin:8px 0 0}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:28px 28px}
#sky{position:fixed;left:0;right:0;bottom:0;width:100%;height:240px;z-index:-1;color:var(--pri);opacity:.16;pointer-events:none}
.card,.tabs button{background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tabs button.on{background:var(--pri)}
.ab{position:relative;overflow:hidden;border-radius:14px;margin:-16px;padding:16px 16px 40px;min-height:440px}
.ab svg{position:absolute;inset:0;width:100%;height:100%;opacity:.3;z-index:0}
.ab .tx{position:relative;z-index:1}
.ab h2{margin:0 0 8px;font-size:20px}
.ab h3{margin:16px 0 4px;font-size:15px;color:var(--pri)}
.ab p{margin:4px 0}
.ab ul,.ab ol{margin:4px 0;padding-right:22px}
.ab li{margin:2px 0}
.info{background:var(--res);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:4px}
.info details{border:0;padding:6px 0 0}
.info p{margin:4px 0}
.tabs button{display:inline-flex;align-items:center;gap:6px}
.hero{position:relative;overflow:hidden;margin:-16px -16px 14px;padding:20px 16px 52px;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff}
.hero h2{margin:0;font-size:22px}.hero p{margin:4px 0 0;font-size:13px;opacity:.92}
.hero .sk{position:absolute;bottom:0;left:0;width:100%;height:46px;fill:#fff;opacity:.2}
.hero .hm{position:absolute;left:14px;top:14px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--pri);font:inherit;font-size:12px;cursor:pointer}
.tile span{color:var(--tx)}
.bn{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bi{width:46px;height:46px;border-radius:12px;background:var(--res);color:var(--pri);display:flex;align-items:center;justify-content:center}
.bn b{font-size:17px}
.dg{background:var(--bg);border:1px dashed var(--bd);border-radius:12px;margin:8px 0;padding:6px;color:var(--pri)}
.dg svg{width:100%;height:auto;display:block;max-height:140px}
.dg text{font-size:11px;fill:var(--tx);stroke:none}
@media print{.info{display:none}}
@media print{body::before,#sky{display:none}body{background:#fff}}
</style>
</head>
<body>
<svg id="sky" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true" fill="currentColor"><rect x="0" y="170" width="400" height="30"/><rect x="10" y="120" width="40" height="80"/><rect x="55" y="90" width="30" height="110"/><rect x="90" y="135" width="45" height="65"/><rect x="140" y="70" width="34" height="130"/><rect x="180" y="110" width="40" height="90"/><rect x="262" y="100" width="36" height="100"/><rect x="304" y="140" width="42" height="60"/><rect x="352" y="85" width="38" height="115"/><path d="M228 200V30h5v170zM205 30h95v5h-95zM228 30l-22-14h50zM292 35v28M290 63h5v6h-5z"/><path d="M233 35l59 0-59-14z" opacity=".6"/></svg>
<header><h1>متره‌یار</h1><p>محاسبه مصالح و برآورد هزینه ساختمان</p></header>
<main>
<div class="tabs" id="tabs"></div>
<div class="card" id="form"></div>
<div id="out"></div>
<p class="note">ضریب‌ها تقریبی‌اند؛ پیش از خرید با مشخصات فنی پروژه تطبیق دهید.</p>
</main>
<script>
const nf=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2});
const fmt=v=>nf.format(v);
const num=s=>{let t=String(s).trim();'۰۱۲۳۴۵۶۷۸۹'.split('').forEach((c,i)=>{t=t.split(c).join(i)});'٠١٢٣٤٥٦٧٨٩'.split('').forEach((c,i)=>{t=t.split(c).join(i)});t=t.replace(/[٫]/g,'.').replace(/[,،]/g,'');const n=parseFloat(t);return isNaN(n)?0:n};
const pos=v=>v<0?0:v;
const C=[
{t:'خانه',home:true},
{t:'دیوارچینی',f:[['l','طول دیوار','متر',10],['h','ارتفاع دیوار','متر',3],['o','مساحت بازشوها','متر مربع',0],['p','تعداد در هر متر مربع','عدد',12.5],['w','درصد ضایعات','%',5]],
 c:v=>{const a=pos(v.l*v.h-v.o);return[['مساحت خالص دیوار',a,'متر مربع'],['تعداد مورد نیاز',Math.ceil(a*v.p*(1+v.w/100)),'عدد']]},pl:'قیمت هر عدد (تومان)',pi:1},
{t:'بتن‌ریزی',f:[['l','طول','متر',5],['w','عرض','متر',4],['t','ضخامت','سانتی‌متر',15],['c','سیمان در هر متر مکعب','کیلوگرم',300],['x','درصد ضایعات','%',5]],
 c:v=>{const m=v.l*v.w*v.t/100*(1+v.x/100),k=m*v.c;return[['حجم بتن',m,'متر مکعب'],['سیمان',k,'کیلوگرم'],['کیسه سیمان (۵۰ کیلویی)',Math.ceil(k/50),'کیسه']]},pl:'قیمت هر متر مکعب بتن (تومان)',pi:0},
{t:'میلگرد',f:[['d','قطر میلگرد','میلی‌متر',12],['l','طول هر شاخه','متر',12],['n','تعداد شاخه','عدد',100]],
 c:v=>{const pm=v.d*v.d/162,L=v.l*v.n;return[['وزن هر متر',pm,'کیلوگرم'],['وزن کل',pm*L,'کیلوگرم'],['طول کل',L,'متر']]},pl:'قیمت هر کیلوگرم (تومان)',pi:1},
{t:'کاشی و سرامیک',f:[['a','مساحت سطح','متر مربع',20],['l','طول کاشی','سانتی‌متر',60],['w','عرض کاشی','سانتی‌متر',60],['x','درصد ضایعات','%',10]],
 c:v=>{const a=v.a*(1+v.x/100),one=v.l*v.w/10000;return[['مساحت با ضایعات',a,'متر مربع'],['تعداد کاشی',one>0?Math.ceil(a/one):0,'عدد']]},pl:'قیمت هر متر مربع (تومان)',pi:0},
{t:'خاموت',f:[['L','طول المان (تیر/ستون)','متر',4],['s','فاصله خاموت‌ها','سانتی‌متر',15],['b','عرض مقطع','سانتی‌متر',30],['h','ارتفاع مقطع','سانتی‌متر',40],['k','پوشش بتن','سانتی‌متر',4],['d','قطر خاموت','میلی‌متر',8]],
 c:v=>{const n=Math.floor(v.L*100/(v.s||1))+1,len=(2*(v.b+v.h-4*v.k)+2*v.d)/100,tot=n*len;return[['تعداد خاموت',n,'عدد'],['طول هر خاموت',len,'متر'],['طول کل',tot,'متر'],['وزن کل',tot*v.d*v.d/162,'کیلوگرم']]},n:'فرض: دو قلاب به طول ۱۰ برابر قطر؛ تعداد = طول ÷ فاصله + ۱',pl:'قیمت هر کیلوگرم (تومان)',pi:3},
{t:'خاک‌برداری',f:[['l','طول','متر',10],['w','عرض','متر',8],['d','عمق','متر',1.5],['s','ضریب تورم خاک','%',25],['k','ظرفیت کامیون','متر مکعب',10]],
 c:v=>{const m=v.l*v.w*v.d,lo=m*(1+v.s/100);return[['حجم خاک‌برداری (در جا)',m,'متر مکعب'],['حجم خاک شل‌شده',lo,'متر مکعب'],['تعداد سفر کامیون',v.k>0?Math.ceil(lo/v.k):0,'سفر']]},n:'ضریب تورم معمول خاک حدود ۲۰ تا ۳۰ درصد است.',pl:'هزینه هر متر مکعب (تومان)',pi:0},
{t:'سفیدکاری',f:[['a','مساحت سطح','متر مربع',50],['t','ضخامت اندود','سانتی‌متر',2],['c','سیمان در هر متر مکعب ملات','کیلوگرم',350],['s','ماسه در هر متر مکعب ملات','متر مکعب',1.1],['x','درصد ضایعات','%',10]],
 c:v=>{const m=v.a*v.t/100*(1+v.x/100),k=m*v.c;return[['مساحت سطح',v.a,'متر مربع'],['حجم ملات',m,'متر مکعب'],['سیمان',k,'کیلوگرم'],['کیسه سیمان (۵۰ کیلویی)',Math.ceil(k/50),'کیسه'],['ماسه',m*v.s,'متر مکعب']]},n:'مقدار مصالح ملات تقریبی است؛ طبق مشخصات پروژه تنظیم کنید.',pl:'قیمت اجرای هر متر مربع (تومان)',pi:0},
{t:'رنگ‌آمیزی',f:[['a','مساحت سطح','متر مربع',100],['n','تعداد دست','عدد',2],['r','پوشش هر لیتر در هر دست','متر مربع',9],['x','درصد ضایعات','%',10]],
 c:v=>[['رنگ مورد نیاز',v.r>0?v.a*v.n/v.r*(1+v.x/100):0,'لیتر']],pl:'قیمت هر لیتر (تومان)',pi:0},
{t:'قوطی و پروفیل',f:[['a','بعد اول','میلی‌متر',40],['b','بعد دوم','میلی‌متر',40],['t','ضخامت جداره','میلی‌متر',2],['l','طول هر شاخه','متر',6],['n','تعداد شاخه','عدد',10]],
 c:v=>{const pm=(2*(v.a+v.b)-4*v.t)*v.t*0.00785;return[['وزن هر متر',pm,'کیلوگرم'],['وزن کل',pm*v.l*v.n,'کیلوگرم']]},n:'وزن تقریبی است؛ گردی گوشه‌ها لحاظ نشده.',pl:'قیمت هر کیلوگرم (تومان)',pi:1},
{t:'مرجع مصالح',ref:true},
{t:'درباره',about:true},
{t:'راهنما',guide:true}
];

const nf3=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:3});
const T=(h,rows)=>`<div class="wrap"><table class="tb"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${typeof x==='number'?nf3.format(x):x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const D=(t,h,rows,n)=>`<details><summary>${t}</summary>${T(h,rows)}${n?`<p class="n">${n}</p>`:''}</details>`;
function refHtml(){return '<p class="n" style="margin:0 0 6px">برای دیدن هر جدول روی عنوان آن بزنید.</p>'
+D('میلگرد آجدار',['قطر (mm)','وزن (kg/m)','سطح مقطع (cm²)'],[[8,0.395,0.503],[10,0.617,0.785],[12,0.888,1.131],[14,1.208,1.539],[16,1.578,2.011],[18,1.998,2.545],[20,2.466,3.142],[22,2.984,3.801],[25,3.853,4.909],[28,4.834,6.158],[32,6.313,8.042]],'وزن هر متر = قطر² ÷ ۱۶۲')
+D('تیرآهن IPE',['شماره','وزن (kg/m)'],[['IPE 80',6],['IPE 100',8.1],['IPE 120',10.4],['IPE 140',12.9],['IPE 160',15.8],['IPE 180',18.8],['IPE 200',22.4],['IPE 220',26.2],['IPE 240',30.7],['IPE 270',36.1],['IPE 300',42.2]],'وزن‌های استاندارد؛ محصول کارخانه‌ها ممکن است کمی فرق کند.')
+D('ناودانی UNP',['شماره','وزن (kg/m)'],[['UNP 80',8.64],['UNP 100',10.6],['UNP 120',13.4],['UNP 140',16],['UNP 160',18.8]])
+D('نبشی بال مساوی',['ابعاد (mm)','وزن (kg/m)'],[['40×40×4',2.42],['50×50×5',3.77],['60×60×6',5.42],['70×70×7',7.38],['80×80×8',9.66]])
+D('طرح اختلاط بتن (راهنما)',['رده','سیمان (kg/m³)','آب به سیمان'],[['C16',275,0.55],['C20',300,0.5],['C25',350,0.45],['C30',400,0.42],['C35',425,0.4]],'مقادیر تقریبی‌اند. مجموع ماسه و شن حدود ۱۸۰۰ تا ۱۹۰۰ کیلوگرم در هر متر مکعب است. طرح نهایی را با آزمایش و مصالح محل تعیین کنید.')
+D('درصد ضایعات مصالح',['مصالح','ضایعات'],[['آجر و بلوک','۵ تا ۸٪'],['کاشی و سرامیک (چیدمان ساده)','۵ تا ۱۰٪'],['کاشی (چیدمان مورب)','۱۰ تا ۱۵٪'],['رنگ','۵ تا ۱۰٪'],['ملات و گچ','۵ تا ۱۰٪'],['بتن','۳ تا ۵٪'],['میلگرد (برش و وصله)','۳ تا ۷٪']],'ارقام تجربی‌اند و به نوع کار بستگی دارند.')
+D('وزن مخصوص مصالح',['ماده','kg/m³'],[['فولاد',7850],['بتن مسلح',2500],['بتن ساده','۲۳۰۰ تا ۲۴۰۰'],['ملات سیمان',2000],['ماسه و شن (خشک)','۱۴۰۰ تا ۱۷۰۰'],['خاک','۱۶۰۰ تا ۱۹۰۰'],['شیشه',2500],['آب',1000]])}
let cur=0;
const $=id=>document.getElementById(id);
function tabs(){$('tabs').innerHTML=C.map((c,i)=>`<button class="${i===cur?'on':''}" onclick="sel(${i})">${ic(c.t,18)}${c.t}</button>`).join('')}
function sel(i){cur=i;tabs();form();$('out').innerHTML=''}
function form(){const c=C[cur];
 if(c.home){$('form').innerHTML=homeHtml();return}
 if(c.ref){$('form').innerHTML=refHtml();return}
 if(c.about){$('form').innerHTML=aboutHtml();return}
 if(c.guide){$('form').innerHTML=guideHtml();return}
 $('form').innerHTML=bannerHtml(c.t)+infoHtml(c.t)+c.f.map(([k,l,u,d])=>`<label for="f_${k}">${l}</label><div class="row"><input id="f_${k}" inputmode="decimal" value="${d}"><span class="u">${u}</span></div>`).join('')
 +`<label for="price">${c.pl} - اختیاری</label><div class="row"><input id="price" inputmode="numeric" placeholder="۰"></div><button class="go" onclick="calc()">محاسبه</button>`}
function calc(){const c=C[cur],v={},ins=[];
 c.f.forEach(([k,l,u])=>{v[k]=num($('f_'+k).value);ins.push(`${l}: ${fmt(v[k])} ${u}`)});
 const r=c.c(v),p=num($('price').value);
 let h=`<div class="res"><div><b>${c.t}</b></div>`+ins.map(s=>`<div style="font-size:13px;color:var(--mut)">${s}</div>`).join('')+'<hr style="border:0;border-top:1px solid var(--bd)">'
 +r.map(([l,x,u])=>`<div>${l}: <b>${fmt(x)}</b> ${u}</div>`).join('');
 if(p>0)h+=`<div class="tot">هزینه تقریبی: ${fmt(r[c.pi][1]*p)} تومان</div>`;
 if(c.n)h+=`<div style="font-size:12px;color:var(--mut);margin-top:6px">${c.n}</div>`;
 h+=`</div><button class="go pr" onclick="cp(this)">کپی نتیجه</button><button class="go pr" onclick="window.print()">ذخیره / چاپ PDF</button>`;
 $('out').innerHTML=h;$('out').scrollIntoView({behavior:'smooth',block:'nearest'})}
function aboutHtml(){return `<div class="ab"><svg viewBox="0 0 300 380" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M40 380C40 290 90 258 150 258S260 290 260 380Z" fill="#1565c0"/><path d="M92 380L108 266 150 306 192 266 208 380Z" fill="#f9a825"/><path d="M99 340h102v10H99zM103 316h94v8h-94z" fill="#fff"/><rect x="134" y="228" width="32" height="38" rx="8" fill="#e0ac84"/><circle cx="150" cy="190" r="44" fill="#f0c09a"/><path d="M104 184C104 128 196 128 196 184Z" fill="#f9a825"/><rect x="94" y="180" width="112" height="11" rx="5" fill="#e68900"/><rect x="143" y="138" width="14" height="42" rx="5" fill="#e68900"/><circle cx="135" cy="203" r="3.5" fill="#333"/><circle cx="165" cy="203" r="3.5" fill="#333"/><path d="M136 217Q150 229 164 217" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/><g transform="rotate(-18 236 320)"><rect x="222" y="262" width="28" height="110" rx="9" fill="#e8f1fb" stroke="#1565c0" stroke-width="3"/><path d="M228 280h16M228 296h16M228 312h16" stroke="#1565c0" stroke-width="2"/></g><circle cx="236" cy="338" r="13" fill="#f0c09a"/></svg><div class="tx"><h2>درباره‌ی متره‌یار</h2>
<p>متره‌یار دستیار کارگاه و دفتر فنی شماست. مقدار مصالح و هزینه‌ی تقریبی کار را در چند ثانیه حساب می‌کند تا پیش از خرید، برآورد دقیق‌تری داشته باشید.</p>
<h3>امکانات</h3>
<ul><li>دیوارچینی، بتن‌ریزی و میلگرد</li><li>خاموت، کاشی و سرامیک</li><li>خاک‌برداری و سفیدکاری</li><li>رنگ‌آمیزی و وزن قوطی و پروفیل</li><li>مرجع مصالح: جدول وزن و مشخصات و درصد ضایعات</li></ul>
<h3>طرز استفاده</h3>
<ol><li>نوع کار را از نوارِ بالا انتخاب کنید.</li><li>ابعاد و ضرایب را وارد کنید. مقدارهای پیش‌فرض قابل تغییرند.</li><li>اگر قیمت واحد را بنویسید، هزینه‌ی تقریبی هم نمایش داده می‌شود.</li><li>نتیجه را کپی یا چاپ کنید.</li></ol>
<h3>توجه</h3>
<p>ضریب‌ها و مقادیر مرجع تقریبی‌اند. پیش از خرید و اجرا، با نقشه‌ها و مشخصات فنی پروژه و نظر مهندس ناظر تطبیق دهید.</p></div></div>`}
